[package]
name = "bollyseerr"
version = "0.1.12"
edition = "2024"
description = "Bollywood & Hindi Movie and Web Series Discovery Agent and Request UI for Jellyseerr/Radarr/Sonarr"
license = "MIT"
authors = ["mlgruby"]

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", default-features = false, features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "signal"] }
tower-http = { version = "0.6", default-features = false, features = ["cors", "trace", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std", "ansi"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
